# nooxshell settings
#
# Edits apply live: the shell redraws its islands as soon as the file is
# saved, and pushes the new values to Hyprland at the same time. Hyprland
# also reads this file on every `hyprctl reload`, so the two never drift.

# Corner radius in pixels. Drives the island scoops and their inner
# corners, the screen bezel corners, and Hyprland's window rounding, so
# the islands and the windows keep the same curve. Range 0-20; larger
# values are treated as 20, the most the islands are laid out for.
rounding = 16

# The apps menu (Super + Alt + Space, or Apps in the main menu) as a grid
# two apps to a line. false gives the single list every other menu uses.
two_column_app_grid = true

# Seconds an island that popped up on its own (time, Wi-Fi, Bluetooth,
# audio, brightness, battery) stays before it slides away. Decimals are
# fine; 0.5-60. The toggle HUD waits 5/7 of this (2.5s at the default).
hide_delay = 2

# The workspace bar leaves sooner: this fraction of hide_delay, 0-1
# (0.43 is 1.5s at the default). A value above 1 is read as a percentage,
# so 43 means the same.
workspace_hide_factor = 0.43
